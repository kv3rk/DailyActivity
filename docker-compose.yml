version: "3.8"

services:

  app:
    build: .
    container_name: daily-app
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://db:5432/daily_plan_project
      - DB_USER=postgres
      - DB_PASSWORD=java2905
      - USER_LOGIN=kv3rk
      - USER_PASSWORD=Java_2905!
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: daily-db
    restart: always
    environment:
      POSTGRES_DB: daily_plan_project
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: java2905
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: