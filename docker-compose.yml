services:

  db:
    image: postgres:16
    container_name: daily-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: daily_plan_project
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: java2905
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d daily_plan_project"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: daily-app
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/daily_plan_project
      DB_USER: postgres
      DB_PASSWORD: java2905

      # 👇 добавили дефолтные логины (чтобы не падало)
      USER_LOGIN: admin
      USER_PASSWORD: admin

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/daily/main"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata: