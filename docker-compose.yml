services:

  db:
    image: postgres:16
    container_name: daily-db
    restart: "no"
    environment:
      POSTGRES_DB: daily_plan_project
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d daily_plan_project"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: daily-app
    restart: "no"
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      USER_LOGIN: ${USER_LOGIN}
      USER_PASSWORD: ${USER_PASSWORD}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      DEFAULT_GOAL_ENGLISH_ANKI_1: ${DEFAULT_GOAL_ENGLISH_ANKI_1}
      DEFAULT_GOAL_ENGLISH_ANKI_2: ${DEFAULT_GOAL_ENGLISH_ANKI_2}
      DEFAULT_GOAL_ENGLISH_SPEAKING: ${DEFAULT_GOAL_ENGLISH_SPEAKING}
      DEFAULT_GOAL_ENGLISH_GRAMMAR: ${DEFAULT_GOAL_ENGLISH_GRAMMAR}
      DEFAULT_GOAL_ENGLISH_WRITING: ${DEFAULT_GOAL_ENGLISH_WRITING}
      DEFAULT_GOAL_ENGLISH_READING: ${DEFAULT_GOAL_ENGLISH_READING}
      DEFAULT_GOAL_ENGLISH_LISTENING: ${DEFAULT_GOAL_ENGLISH_LISTENING}
      DEFAULT_GOAL_PROGRAMMING_INTERVIEW: ${DEFAULT_GOAL_PROGRAMMING_INTERVIEW}
      DEFAULT_GOAL_WATER: ${DEFAULT_GOAL_WATER}
      DEFAULT_GOAL_RUN: ${DEFAULT_GOAL_RUN}
      DEFAULT_GOAL_CLEANING: ${DEFAULT_GOAL_CLEANING}
      DEFAULT_GOAL_TOEFL: ${DEFAULT_GOAL_TOEFL}
      DEFAULT_GOAL_WEEKLY_REVIEW: ${DEFAULT_GOAL_WEEKLY_REVIEW}
      DEFAULT_GOAL_STRENGTH: ${DEFAULT_GOAL_STRENGTH}
      DEFAULT_GOAL_WEEKLY_WEIGH: ${DEFAULT_GOAL_WEEKLY_WEIGH}
      DEFAULT_GOAL_JOB_SEARCH: ${DEFAULT_GOAL_JOB_SEARCH}
      DEFAULT_GOAL_MORNING_ROUTINE: ${DEFAULT_GOAL_MORNING_ROUTINE}
      DEFAULT_GOAL_EVENING_ROUTINE: ${DEFAULT_GOAL_EVENING_ROUTINE}
      DEFAULT_GOAL_ANKI_WEEKLY_1: ${DEFAULT_GOAL_ANKI_WEEKLY_1}
      DEFAULT_GOAL_ANKI_WEEKLY_2: ${DEFAULT_GOAL_ANKI_WEEKLY_2}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: