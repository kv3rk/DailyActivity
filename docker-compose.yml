services:

  db:
    image: postgres:16
    container_name: daily-db
    restart: always
    environment:
      POSTGRES_DB: daily_plan_project
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d daily_plan_project"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: daily-app
    restart: always

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/daily_plan_project
      DB_USER: postgres
      DB_PASSWORD: java2905

    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: