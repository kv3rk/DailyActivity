services:

  db:
    image: postgres:16
    container_name: daily-db
    restart: "no"
    environment:
      POSTGRES_DB: daily_plan_project
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d daily_plan_project"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: daily-app
    restart: "no"

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      USER_LOGIN: ${USER_LOGIN}
      USER_PASSWORD: ${USER_PASSWORD}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_CHAT_ID: ${TELEGRAM_BOT_CHAT_ID}
      DEFAULT_GOAL_NUMBER1: ${DEFAULT_GOAL_NUMBER1}
      DEFAULT_GOAL_NUMBER2: ${DEFAULT_GOAL_NUMBER2}
      DEFAULT_GOAL_NUMBER3: ${DEFAULT_GOAL_NUMBER3}
      DEFAULT_GOAL_NUMBER4: ${DEFAULT_GOAL_NUMBER4}
      DEFAULT_GOAL_NUMBER5: ${DEFAULT_GOAL_NUMBER5}
      DEFAULT_GOAL_NUMBER6: ${DEFAULT_GOAL_NUMBER6}
      DEFAULT_GOAL_NUMBER7: ${DEFAULT_GOAL_NUMBER7}
      DEFAULT_GOAL_NUMBER8: ${DEFAULT_GOAL_NUMBER8}
      DEFAULT_GOAL_NUMBER9: ${DEFAULT_GOAL_NUMBER9}
      DEFAULT_GOAL_NUMBER10: ${DEFAULT_GOAL_NUMBER10}
      DEFAULT_GOAL_NUMBER11: ${DEFAULT_GOAL_NUMBER11}
      DEFAULT_GOAL_NUMBER12: ${DEFAULT_GOAL_NUMBER12}
      ACTIVITY_TYPE_1: ${ACTIVITY_TYPE_1}
      ACTIVITY_TYPE_2: ${ACTIVITY_TYPE_2}
      ACTIVITY_TYPE_3: ${ACTIVITY_TYPE_3}
      ACTIVITY_TYPE_4: ${ACTIVITY_TYPE_4}
      ACTIVITY_TYPE_5: ${ACTIVITY_TYPE_5}
      ACTIVITY_TYPE_6: ${ACTIVITY_TYPE_6}

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/daily/main"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata: