spring:
  application:
    name: DailyPlan
  profiles:
    active: prod
  main:
    banner-mode: off
  flyway:
    baseline-on-migrate: true
telegram:
  bot:
    username: ${TELEGRAM_BOT_USERNAME}
    token: ${TELEGRAM_BOT_TOKEN}
    chat:
      id: ${TELEGRAM_BOT_CHAT_ID}
default:
  goal:
    number1: ${DEFAULT_GOAL_NUMBER1}
    number2: ${DEFAULT_GOAL_NUMBER2}
    number3: ${DEFAULT_GOAL_NUMBER3}
    number4: ${DEFAULT_GOAL_NUMBER4}
    number5: ${DEFAULT_GOAL_NUMBER5}
    number6: ${DEFAULT_GOAL_NUMBER6}
    number7: ${DEFAULT_GOAL_NUMBER7}
    number8: ${DEFAULT_GOAL_NUMBER8}
    number9: ${DEFAULT_GOAL_NUMBER9}
    number10: ${DEFAULT_GOAL_NUMBER10}
    number11: ${DEFAULT_GOAL_NUMBER11}
    number12: ${DEFAULT_GOAL_NUMBER12}
    number13: ${DEFAULT_GOAL_NUMBER13}
activity:
  type:
    1: ${ACTIVITY_TYPE_1}
    2: ${ACTIVITY_TYPE_2}
    3: ${ACTIVITY_TYPE_3}
    4: ${ACTIVITY_TYPE_4}
    5: ${ACTIVITY_TYPE_5}
    6: ${ACTIVITY_TYPE_6}