<!DOCTYPE html>


<html xmlns:th="http://www.thymeleaf.org">


<head>


    <meta charset="UTF-8">

    <title>Daily Plan</title>


    <!--    Icon-->
    <link rel="icon" type="image/x-icon" href="/images/clock.png"/>

    <!--    CSS-->
    <link rel="stylesheet" href="/css/style.css"/>
    <link rel="stylesheet" href="/css/Error.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!--    Scripts-->
    <script defer src="/js/DailyPlan/ErrorHandling.js"></script>
    <script defer src="/js/DailyPlan/script.js"></script>
    <script defer src="/js/TimerActivity/timer.js"></script>
    <script defer src="/js/DailyPlan/refreshingInterface.js"></script>


</head>
<body>

<div id="topbar">
    <div class="brand">
        <div class="brand-icon">✓</div>
        <span class="brand-name">Daily Plan</span>
    </div>
    <form onsubmit="add_goal(event)" id="input-goals-form">
        <input type="text" placeholder="What's your next goal?" class="form-control" id="textfield-goals"/>
        <button type="submit" id="addition-button">+ Add</button>
    </form>
</div>

<div id="content">
    <div class="panel">
        <div class="panel-header">
            <span class="panel-title">Daily goals</span>
        </div>
        <div class="goals-scroll">
            <ul id="list-active-goals" style="display:contents; list-style:none;">
                <li class="goal-item element-active-goal"
                    th:each="element : ${active_goals}"
                    th:id="${element.id()}">
                    <div class="goal-dot"></div>
                    <span class="goal-text" th:text="${element.goalText()}"></span>
                    <button type="button" onclick="toggleFlag(event)" class="done-button">Done</button>
                </li>
            </ul>
        </div>
    </div>

    <div class="panel">
        <div class="panel-header">
            <span class="panel-title">Accomplished</span>
        </div>
        <div class="goals-scroll">
            <ul id="list-done-goals" style="display:contents; list-style:none;">
                <li class="goal-item element-done-goal"
                    th:each="element : ${done_goals}">
                    <div class="goal-dot"></div>
                    <span class="goal-text" th:text="${element.goalText()}"></span>
                </li>
            </ul>
        </div>
    </div>

    <div id="timer-panel">
        <div class="timer-header">Activity Timer</div>
        <div id="timer-display">45:00</div>
        <div class="timer-sub">minutes remaining</div>
        <input type="number" id="minutes-input" class="form-control" min="1" value="45">
        <hr class="timer-divider">
        <div class="timer-actions">
            <button type="button" class="timer-btn" id="start-timer-btn">Start session</button>
            <button type="button" class="timer-btn" id="pause-timer-btn">Pause</button>
            <button type="button" class="timer-btn" id="stop-timer-btn">Stop & save</button>
        </div>
    </div>
</div>

<div id="activity-modal-overlay">
    <div id="activity-modal">
        <h2 id="activity-modal-title">Session complete</h2>
        <p id="activity-modal-subtitle">What were you working on?</p>
        <select id="activity-type">
            <option th:each="element : ${activity_types}" th:value="${element}" th:text="${element}">Backend</option>
        </select>
        <textarea id="activity-comment" placeholder="Add a short note..."></textarea>
        <button id="activity-submit-btn">Save session</button>
    </div>
</div>

<div id="error-modal-overlay">
    <div id="error-modal">
        <h2 id="error-modal-title">Something went wrong</h2>
        <p id="error-modal-message">Please try again</p>
        <button id="error-modal-close">Close</button>
    </div>
</div>

</body>
</html>
