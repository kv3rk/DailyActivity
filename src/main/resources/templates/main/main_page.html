<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">

    <title>Daily Plan</title>

    <!--    Icon-->
    <link rel="icon" type="image/x-icon" href="/images/clock.png"/>

    <!--    CSS-->
    <link rel="stylesheet" href="/css/main-page/style.css"/>
    <link rel="stylesheet" href="/css/main-page/stopwatch.css"/>
    <link rel="stylesheet" href="/css/main-page/Error.css"/>
    <link rel="stylesheet" href="/css/sidebar.css/">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">


    <!--    Scripts-->
    <script defer src="/js/DailyPlan/ErrorHandling.js"></script>
    <script defer src="/js/DailyPlan/script.js"></script>
    <script defer src="/js/TimerActivity/timer.js"></script>
    <script defer src="/js/TimerActivity/Stopwatch.js"></script>
    <script defer src="/js/sidebar-toggle.js"></script>
    <script defer src="/js/DailyPlan/refreshingInterface.js"></script>


</head>
<body>

<!-- Sidebar -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-username" th:text="${username}">Username</div>
    </div>
    <div class="sidebar-divider"></div>
    <ul class="sidebar-menu">
        <li>
            <a href="/" class="sidebar-item" data-page="main">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                Daily Activity Tracker
            </a>
        </li>
        <li>
            <a href="#" class="sidebar-item" data-page="settings">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
                Settings
            </a>
        </li>
        <li>
            <form th:action="@{/logout}" method="post" class="sidebar-logout-form">
                <button type="submit" class="sidebar-item logout" data-page="logout">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    Logout
                </button>
            </form>
        </li>
    </ul>
</div>

<div id="topbar">
    <div class="topbar-left">
        <button type="button" class="hamburger-btn" onclick="toggleSidebar()" aria-label="Open menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                 stroke-linejoin="round">
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
        <div class="brand">
            <div class="brand-icon">✓</div>
            <span class="brand-name">Daily Plan</span>
        </div>
    </div>
    <form onsubmit="add_goal(event)" id="input-goals-form">
        <input type="text" placeholder="What's your next goal?" class="form-control" id="textfield-goals"/>
        <button type="submit" id="addition-button">+ Add</button>
    </form>
</div>

<div id="content">
    <div class="panel">
        <div class="panel-header">
            <span class="panel-title">Daily goals</span>
        </div>
        <div class="goals-scroll">
            <ul id="list-active-goals" style="display:contents; list-style:none;">
                <li class="goal-item element-active-goal"
                    th:each="element : ${active_goals}"
                    th:id="${element.id()}">
                    <div class="goal-dot"></div>
                    <span class="goal-text" th:text="${element.goalText()}"></span>
                    <button type="button" onclick="toggleFlag(event)" class="done-button">Done</button>
                </li>
            </ul>
        </div>
    </div>

    <div class="panel">
        <div class="panel-header">
            <span class="panel-title">Accomplished</span>
        </div>
        <div class="goals-scroll">
            <ul id="list-done-goals" style="display:contents; list-style:none;">
                <li class="goal-item element-done-goal"
                    th:each="element : ${done_goals}">
                    <div class="goal-dot"></div>
                    <span class="goal-text" th:text="${element.goalText()}"></span>
                </li>
            </ul>
        </div>
    </div>

    <!-- Timer / Stopwatch Panel -->
    <div id="timer-panel">
        <!-- Switcher -->
        <div class="timer-mode-switcher">
            <button type="button" class="mode-btn active" id="mode-timer-btn" onclick="switchToTimer()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                     stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                Timer
            </button>
            <button type="button" class="mode-btn" id="mode-stopwatch-btn" onclick="switchToStopwatch()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                     stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 8 14"></polyline>
                </svg>
                Stopwatch
            </button>
        </div>

        <!-- Timer View -->
        <div id="timer-view">
            <div class="timer-header">Activity Timer</div>
            <div id="timer-display">45:00</div>
            <div class="timer-sub">minutes remaining</div>
            <input type="number" id="minutes-input" class="form-control" min="1" value="45">
            <hr class="timer-divider">
            <div class="timer-actions">
                <button type="button" class="timer-btn" id="start-timer-btn">Start session</button>
                <button type="button" class="timer-btn" id="pause-timer-btn">Pause</button>
                <button type="button" class="timer-btn" id="stop-timer-btn">Stop & save</button>
            </div>
        </div>

        <!-- Stopwatch View -->
        <div id="stopwatch-view" style="display: none;">
            <div class="timer-header">Activity Stopwatch</div>
            <div id="stopwatch-display">00:00:00</div>
            <div class="timer-sub">elapsed time</div>
            <hr class="timer-divider">
            <div class="timer-actions">
                <button type="button" class="timer-btn" id="start-stopwatch-btn">Start session</button>
                <button type="button" class="timer-btn" id="pause-stopwatch-btn">Pause</button>
                <button type="button" class="timer-btn" id="stop-stopwatch-btn">Stop & save</button>
            </div>
        </div>
    </div>
</div>

<div id="activity-modal-overlay">
    <div id="activity-modal">
        <h2 id="activity-modal-title">Session complete</h2>
        <p id="activity-modal-subtitle">What were you working on?</p>
        <select id="activity-type">
            <option th:each="element : ${activity_types}" th:value="${element}" th:text="${element}">Backend</option>
        </select>
        <textarea id="activity-comment" placeholder="Add a short note..."></textarea>
        <button id="activity-submit-btn">Save session</button>
    </div>
</div>

<div id="error-modal-overlay">
    <div id="error-modal">
        <h2 id="error-modal-title">Something went wrong</h2>
        <p id="error-modal-message">Please try again</p>
        <button id="error-modal-close">Close</button>
    </div>
</div>

</body>
</html>
