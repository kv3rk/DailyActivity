<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Daily Plan</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">

    <link rel="icon" type="image/x-icon" href="/images/clock.png"/>

    <link rel="stylesheet" href="/css/style.css"/>

    <script defer src="/js/script.js"></script>
    <script defer src="/js/timer.js"></script>

</head>

<body>

<div id="page-wrapper">

    <!-- HERO -->
    <div class="container" id="greeting-phrase">

        <div class="hero-card">

            <h1 class="hero-title">
                Daily Plan
            </h1>

            <p class="hero-subtitle">
                Organize your plan efficiently
            </p>

        </div>

    </div>


    <!-- MAIN CONTENT -->
    <div class="container-fluid px-4" id="main-content">

        <!-- ACTIVE GOALS -->
        <div class="card">

            <div class="card-header">
                <span id="active-goals-title">
                    Daily goals
                </span>
            </div>

            <div class="card-body">

                <form
                        onsubmit="add_goal(event)"
                        id="input-goals-form">

                    <input type="text"
                           placeholder="Input a goal"
                           class="form-control"
                           id="textfield-goals"/>

                    <button type="submit"
                            id="addition-button"
                            class="btn btn-primary">

                        Add

                    </button>

                </form>

            </div>

            <div class="card-footer goals-scroll-area">

                <ul class="list-group list-group-flush"
                    id="list-active-goals">

                    <li class="list-group-item goal-item element-active-goal"
                        th:each="element : ${active_goals}"
                        th:id="${element.id()}">

                        <span class="goal-text"
                              th:text="${element.goalText()}">
                        </span>

                        <button
                                type="button"
                                onclick="toggleFlag(event)"
                                class="btn btn-danger btn-sm done-button">

                            Done

                        </button>

                    </li>

                </ul>

            </div>

        </div>


        <!-- DONE GOALS -->
        <div class="card">

            <div class="card-header">

                <span id="done-goals-title">
                    Accomplished goals
                </span>

            </div>

            <div class="card-body goals-scroll-area"
                 id="card-body-done-goals">

                <ul class="list-group list-group-flush"
                    id="list-done-goals">

                    <li class="list-group-item goal-item element-done-goal"
                        th:each="element : ${done_goals}"
                        th:text="${element.goalText()}">

                    </li>

                </ul>

            </div>

        </div>

    </div>


    <!-- TIMER -->
    <div class="container-fluid px-4" id="timer">

        <div class="card timer-card">

            <div class="card-header">

                Activity Timer

            </div>

            <div class="card-body timer-card-body">

                <div id="timer-display">

                    45:00

                </div>

                <div class="timer-inputs">

                    <input type="number"
                           id="minutes-input"
                           class="form-control"
                           min="1"
                           value="45">

                </div>

            </div>

            <div class="card-footer timer-card-footer">

                <button
                        type="button"
                        class="btn timer-btn"
                        id="start-timer-btn">

                    Start

                </button>

                <button
                        type="button"
                        class="btn timer-btn"
                        id="pause-timer-btn">

                    Pause

                </button>

                <button
                        type="button"
                        class="btn timer-btn"
                        id="stop-timer-btn">

                    Stop

                </button>

            </div>

        </div>

    </div>

</div>

<!-- TIMER FINISHED MODAL -->

<div id="activity-modal-overlay">

    <div id="activity-modal">

        <h2 id="activity-modal-title">
            Timer finished
        </h2>

        <p id="activity-modal-subtitle">
            What were you doing?
        </p>

        <select id="activity-type">

            <option value="backend">
                Backend
            </option>

            <option value="games">
                Games
            </option>

            <option value="english">
                English
            </option>

        </select>

        <textarea
                id="activity-comment"
                placeholder="Write short comment...">
        </textarea>

        <button id="activity-submit-btn">

            Save activity

        </button>

    </div>

</div>

</body>

</html>
