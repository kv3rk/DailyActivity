<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Error</title>

    <!--    ICON-->
    <link rel="icon" type="image/x-icon" href="/images/clock.png"/>

    <!--    CSS-->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="/css/error-page/error-page-style.css/">

</head>

<body>

<div class="error-card">

    <div class="error-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
    </div>

    <h1>Something went wrong</h1>

    <p>
        The application failed to load. Please try again or contact support if the problem persists.
    </p>

    <a href="/daily/main">
        Try again
    </a>

</div>

</body>
</html>
