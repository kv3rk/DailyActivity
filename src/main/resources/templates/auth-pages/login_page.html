<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">
    <title>Login</title>

    <link rel="icon" type="image/x-icon" href="/images/clock.png"/>
    <link href="/css/auth/auth-pages.css" rel="stylesheet">

</head>

<body>

<div class="auth-card">

    <div class="brand-icon">✓</div>

    <div class="title">Daily Plan</div>
    <div class="subtitle">Log in to your account</div>

    <form th:action="@{/daily/login}" method="post">

        <div th:if="${param.error}" class="error">
            Invalid username or password
        </div>

        <input type="text"
               name="username"
               class="form-control"
               placeholder="Username">

        <input type="password"
               name="password"
               class="form-control"
               placeholder="Password">

        <button class="btn-auth" type="submit">
            Log in
        </button>

    </form>

    <div class="auth-switch">
        <span>New here?</span>
        <a th:href="@{/daily/registration}" class="auth-switch-link">Sign Up</a>
    </div>

</div>

</body>
</html>
