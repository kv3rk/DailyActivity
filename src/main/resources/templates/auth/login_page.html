<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="icon" type="image/x-icon" href="/images/clock.png"/>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(135deg, #e7ecef, #d7e3fc);
            overflow: hidden;
        }

        /* glow background */
        body::before {
            content: "";
            position: fixed;
            inset: -200px;
            background: radial-gradient(circle at 30% 20%, rgba(144,219,244,0.4), transparent 40%),
            radial-gradient(circle at 70% 80%, rgba(163,206,241,0.35), transparent 45%);
            filter: blur(40px);
        }

        .login-card {
            width: 360px;
            padding: 30px;

            border-radius: 22px;
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(10px);

            box-shadow: 0 20px 60px rgba(0,0,0,0.15);

            text-align: center;
            z-index: 1;
        }

        .title {
            font-size: 28px;
            font-weight: bold;
            color: #274c77;
            margin-bottom: 20px;
        }

        .form-control {
            border-radius: 12px;
            border: none;
            padding: 12px;
            margin-bottom: 12px;
        }

        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(144,219,244,0.5);
        }

        .btn-login {
            width: 100%;
            border-radius: 12px;
            border: none;
            padding: 10px;

            background: #274c77;
            color: white;
            font-weight: bold;

            transition: 0.2s;
        }

        .btn-login:hover {
            transform: scale(1.03);
            box-shadow: 0 10px 25px rgba(39,76,119,0.3);
        }

        .error {
            color: #d62828;
            font-size: 14px;
            margin-bottom: 10px;
        }
    </style>

</head>

<body>

<div class="login-card">

    <div class="title">Daily Plan</div>

    <form th:action="@{/login}" method="post">

        <div th:if="${param.error}" class="error">
            Invalid username or password
        </div>

        <input type="text"
               name="username"
               class="form-control"
               placeholder="Username">

        <input type="password"
               name="password"
               class="form-control"
               placeholder="Password">

        <button class="btn-login" type="submit">
            Login
        </button>

    </form>

</div>

</body>
</html>
