<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">
    <title>Sign Up</title>

    <link rel="icon" type="image/x-icon" href="/images/clock.png"/>
    <link href="/css/auth/auth-pages.css" rel="stylesheet">

</head>

<body>

<div class="auth-card">

    <div class="brand-icon">✓</div>

    <div class="title">Daily Plan</div>
    <div class="subtitle">Create your account</div>

    <div th:if="${registrationError}"
         th:text="${registrationError}"
         class="error">
        Registration failed. Please try again.
    </div>

    <form th:action="@{/daily/get/credentials}" method="post" th:object="${registrationDTO}">


        <input type="text"
               th:field="*{username}"
               class="form-control"
               placeholder="Username">

        <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>

        <input type="password"
               th:field="*{password}"
               class="form-control"
               placeholder="Password">

        <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>

        <button class="btn-auth" type="submit">
            Sign up
        </button>

    </form>

    <div class="auth-switch">
        <span>Already have an account?</span>
        <a th:href="@{/daily/login}" class="auth-switch-link">Log in</a>
    </div>

</div>

</body>
</html>
