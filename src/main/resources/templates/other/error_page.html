<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Error</title>

    <link rel="icon" type="image/x-icon" href="/images/exclamation.png"/>

    <style>
        body {
            margin: 0;
            background: #1f1f1f;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .error-card {
            background: darkred;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 48px;
        }

        p {
            font-size: 20px;
            margin-top: 10px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            background: white;
            color: darkred;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="error-card">

    <h1>Critical Error</h1>

    <p>
        The application failed to load.
    </p>

    <a href="/daily/main">
        Try again
    </a>

</div>

</body>
</html>
